<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Desxifrat - Operació Incògnita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body {
            background-color: #050505;
            color: #00ff41;
            font-family: 'Share+Tech+Mono', monospace;
        }

        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 50;
        }

        .terminal-card {
            border: 1px solid #00ff41;
            background: rgba(0, 40, 0, 0.2);
            transition: all 0.3s ease;
        }

        .terminal-card.unlocked {
            border: 2px solid #fff;
            background: rgba(0, 255, 65, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }

        input {
            background: #000;
            border: 1px solid #008f11;
            color: #00ff41;
            padding: 4px;
            width: 60px;
            text-align: center;
        }

        input:disabled {
            color: #fff;
            border-color: #444;
            background: #222;
        }

        .btn-decode {
            background: #008f11;
            color: #000;
            font-weight: bold;
            padding: 4px 12px;
            transition: all 0.2s;
        }

        .btn-decode:hover {
            background: #00ff41;
            box-shadow: 0 0 10px #00ff41;
        }
    </style>
</head>
<body class="p-6 md:p-10">
    <div class="crt-overlay"></div>

    <header class="text-center mb-10">
        <h1 class="text-4xl font-bold tracking-widest uppercase mb-2">OPERACIÓ INCÒGNITA</h1>
        <p class="text-xs opacity-60">SISTEMA CENTRAL DE DESCODIFICACIÓ V4.0</p>
    </header>

    <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
        <!-- Cards generated by JS -->
    </div>

    <div id="final-zone" class="mt-12 hidden opacity-0 transition-opacity duration-1000 max-w-4xl mx-auto text-center border-t border-green-800 pt-8">
        <h2 class="text-2xl mb-4 text-white uppercase tracking-[0.3em]">Missatge Desxifrat Complet</h2>
        <div class="text-3xl font-bold p-6 bg-green-900/30 border-2 border-green-400 text-green-100">
            "SI L'X ÉS EL PROBLEMA, NOSALTRES SOM LA SOLUCIÓ"
        </div>
        <p class="mt-4 text-sm italic">L'enigma ha estat resolt. Aneu a recollir el tresor.</p>
    </div>

    <script>
        const groups = [
            { id: 1, name: "NOM DEL GRUP 1", solutions: ["30", "7", "180", "45"], word: "SI L'X" },
            { id: 2, name: "NOM DEL GRUP 2", solutions: ["10", "6", "28", "13"], word: "ÉS EL" },
            { id: 3, name: "NOM DEL GRUP 3", solutions: ["40", "100", "20", "20"], word: "PROBLEMA," },
            { id: 4, name: "NOM DEL GRUP 4", solutions: ["70", "5", "36", "15"], word: "NOSALTRES" },
            { id: 5, name: "NOM DEL GRUP 5", solutions: ["16", "4", "5", "12"], word: "SOM LA" },
            { id: 6, name: "NOM DEL GRUP 6", solutions: ["10", "4", "900", "10"], word: "SOLUCIÓ" }
        ];

        let unlockedCount = 0;

        function checkGroup(id) {
            const group = groups.find(g => g.id === id);
            let allCorrect = true;

            group.solutions.forEach((sol, index) => {
                const input = document.getElementById(`g${id}-x${index + 1}`);
                if (input.value.trim() !== sol) {
                    allCorrect = false;
                    input.classList.add('border-red-600');
                    setTimeout(() => input.classList.remove('border-red-600'), 1000);
                }
            });

            if (allCorrect) {
                const card = document.getElementById(`card-${id}`);
                const wordDisplay = document.getElementById(`word-${id}`);
                const inputs = card.querySelectorAll('input');
                const btn = card.querySelector('button');

                card.classList.add('unlocked');
                wordDisplay.innerText = group.word;
                wordDisplay.classList.remove('opacity-10');
                wordDisplay.classList.add('text-white', 'scale-110');
                
                inputs.forEach(i => i.disabled = true);
                btn.style.display = 'none';

                unlockedCount++;
                if (unlockedCount === 6) {
                    showFinal();
                }
            }
        }

        function showFinal() {
            const zone = document.getElementById('final-zone');
            zone.classList.remove('hidden');
            setTimeout(() => zone.classList.add('opacity-100'), 100);
        }

        // Render cards
        const container = document.getElementById('grid-container');
        groups.forEach(g => {
            const card = document.createElement('div');
            card.id = `card-${g.id}`;
            card.className = 'terminal-card p-6 flex flex-col items-center gap-4';
            
            let inputsHTML = '';
            g.solutions.forEach((_, i) => {
                inputsHTML += `
                    <div class="flex flex-col items-center">
                        <span class="text-[10px] mb-1 opacity-50">x${i+1}</span>
                        <input type="text" id="g${g.id}-x${i+1}" placeholder="?">
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="w-full flex justify-between items-start mb-2">
                    <span class="text-xs">${g.name}</span>
                    <span class="text-xs px-2 py-0.5 border border-green-800">GRUP ${g.id}</span>
                </div>
                <div class="flex gap-2 mb-2">
                    ${inputsHTML}
                </div>
                <button onclick="checkGroup(${g.id})" class="btn-decode text-xs uppercase">Validar Dades</button>
                <div class="mt-4 text-center">
                    <div id="word-${g.id}" class="text-xl tracking-widest opacity-10 transition-all duration-500">
                        ********
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
